name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  checks-and-tests:
    name: checks-and-tests
    runs-on: ubuntu-latest

    env:
      DB__USER: postgres
      DB__PASSWORD: postgres
      DB__HOST: localhost
      DB__PORT: "5432"
      DB__DATABASE_NAME: album_tracker_db
      DB__RUN_MIGRATIONS_ON_STARTUP: "false"
      JWT__SECRET_KEY: "00000000000000000000000000000000"
      JWT__ALGORITHM: HS256

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install mise tools
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Run formatting, linting, and type checks
        run: mise run check

      - name: Run integration tests
        run: mise run test
